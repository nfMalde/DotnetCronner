name: Release Package

# Releases are triggered manually by a maintainer from the Actions tab (workflow_dispatch), never by a
# pushed tag or by merging a PR — so a contributor can neither mis-publish nor trigger a release. Pick the
# package and how to bump; the workflow reads the last release tag and computes the next version, so you
# don't have to look it up. The exact version is shown in the "prepare" summary, and the actual NuGet push
# waits on the `release` environment's approval gate (configure required reviewers in
# Settings > Environments > release) — a final confirmation before the irreversible publish.

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to release
        type: choice
        options: [abstractions, core, redis, efcore]
        required: true
      bump:
        description: Version part to bump (ignored if 'version' is set)
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: Explicit version, e.g. 1.0.0 (overrides bump)
        required: false
      prerelease:
        description: Prerelease? (appends -preview.<run> to an auto-bumped version; for an explicit version include the suffix yourself)
        type: boolean
        default: false
      abstractions_dependency:
        description: DotnetCronner.Abstractions dependency floor ('latest' = its last published tag; or type a version, e.g. 0.0.3)
        required: false
        default: latest
      core_dependency:
        description: DotnetCronner (core) dependency floor ('latest' = its last published tag; or type a version)
        required: false
        default: latest
      # ── Deprecating older versions is MANUAL for now ────────────────────────────────────────────────────
      # The inputs and steps that drove this were removed on 2026-08-19: nuget.org has no supported API for
      # deprecation. The endpoint the script called is undocumented (only the web UI is documented at
      # https://learn.microsoft.com/nuget/nuget-org/deprecate-packages) and returned HTTP 403 with the
      # gallery's generic authorization page rather than NuGet's API-key error, so it is not simply a scope
      # problem we can widen. A supported REST API is still an open request:
      # https://github.com/NuGet/NuGetGallery/issues/8873
      #
      # Until that ships: nuget.org → Manage packages → Deprecation → Select all versions → Legacy →
      # alternate = the release just published. .github/scripts/deprecate-previous.sh is KEPT so this can be
      # re-wired unchanged if the API becomes supported, or retried by hand with a classic API key scoped to
      # Unlist (untested — that is the one experiment that would distinguish a scope problem from a gated
      # endpoint).

# Least-privilege default; the publish job widens this for the GitHub Release and the OIDC token.
permissions:
  contents: read

# One release at a time across ALL packages (not per-package), so a dependent can never run while a
# dependency's release is still in flight — its tag is created at the end of that run.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      project: ${{ steps.plan.outputs.project }}
      pkgdir: ${{ steps.plan.outputs.pkgdir }}
      package_id: ${{ steps.plan.outputs.package_id }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      ver_abstractions: ${{ steps.plan.outputs.ver_abstractions }}
      ver_core: ${{ steps.plan.outputs.ver_core }}
      ver_redis: ${{ steps.plan.outputs.ver_redis }}
      ver_efcore: ${{ steps.plan.outputs.ver_efcore }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Compute version
        id: plan
        run: |
          set -euo pipefail
          KEY="${{ github.event.inputs.package }}"
          case "$KEY" in
            abstractions) PROJECT="src/DotnetCronner.Abstractions/DotnetCronner.Abstractions.csproj"; PKGDIR="src/DotnetCronner.Abstractions"; PACKAGE_ID="DotnetCronner.Abstractions" ;;
            core)         PROJECT="src/DotnetCronner/DotnetCronner.csproj"; PKGDIR="src/DotnetCronner"; PACKAGE_ID="DotnetCronner" ;;
            redis)        PROJECT="src/DotnetCronner.Stores.Redis/DotnetCronner.Stores.Redis.csproj"; PKGDIR="src/DotnetCronner.Stores.Redis"; PACKAGE_ID="DotnetCronner.Stores.Redis" ;;
            efcore)       PROJECT="src/DotnetCronner.Stores.EntityFrameworkCore/DotnetCronner.Stores.EntityFrameworkCore.csproj"; PKGDIR="src/DotnetCronner.Stores.EntityFrameworkCore"; PACKAGE_ID="DotnetCronner.Stores.EntityFrameworkCore" ;;
            *) echo "::error::Unknown package '$KEY'."; exit 1 ;;
          esac

          git fetch --tags --force
          EXPLICIT="${{ github.event.inputs.version }}"
          if [[ -n "$EXPLICIT" ]]; then
            # Explicit version is used verbatim (include any prerelease suffix yourself).
            if [[ ! "$EXPLICIT" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Version '$EXPLICIT' is not a valid SemVer."; exit 1
            fi
            VERSION="$EXPLICIT"
          else
            # Highest existing FULL release (exclude prereleases, which contain '-').
            LATEST="$(git tag -l "${KEY}-v*" | sed "s#^${KEY}-v##" | grep -vE -- '-' | sort -V | tail -n1)"
            [[ -z "$LATEST" ]] && LATEST="0.0.0"
            IFS=. read -r MA MI PA <<< "$LATEST"
            case "${{ github.event.inputs.bump }}" in
              major) MA=$((MA + 1)); MI=0; PA=0 ;;
              minor) MI=$((MI + 1)); PA=0 ;;
              patch) PA=$((PA + 1)) ;;
            esac
            VERSION="$MA.$MI.$PA"
            if [[ "${{ github.event.inputs.prerelease }}" == "true" ]]; then
              VERSION="${VERSION}-preview.${GITHUB_RUN_NUMBER}"
            fi
          fi

          # A prerelease is any version carrying a SemVer prerelease suffix.
          if [[ "$VERSION" == *-* ]]; then PRERELEASE=true; else PRERELEASE=false; fi

          TAG="${KEY}-v${VERSION}"
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists — pick a different version/bump."; exit 1
          fi

          # Cross-package dependency versions: each package's latest published tag (or 0.0.0 if never
          # released). The package being released takes its computed VERSION. Directory.Build.props reads
          # these so the packed dependency ranges are correct without any csproj version.
          ver_of() {
            local v; v="$(git tag -l "$1-v*" | sed "s#^$1-v##" | sort -V | tail -n1)"
            [[ -z "$v" ]] && v="0.0.0"
            printf '%s' "$v"
          }
          VER_ABS="$(ver_of abstractions)"; VER_CORE="$(ver_of core)"; VER_REDIS="$(ver_of redis)"; VER_EF="$(ver_of efcore)"

          # Optional explicit dependency floors override the last-published-tag lookup — pin deps for a
          # coordinated release so the result never depends on tag timing. 'latest' (the default) or blank
          # means "use the last published tag".
          DEP_ABS="${{ github.event.inputs.abstractions_dependency }}"
          DEP_CORE="${{ github.event.inputs.core_dependency }}"
          [[ "$DEP_ABS" == "latest" ]] && DEP_ABS=""
          [[ "$DEP_CORE" == "latest" ]] && DEP_CORE=""
          [[ -n "$DEP_ABS" ]] && VER_ABS="$DEP_ABS"
          [[ -n "$DEP_CORE" ]] && VER_CORE="$DEP_CORE"

          # Guard against the release-order race: if a dependency's CHANGELOG documents a newer version than
          # the floor about to be pinned (it has unreleased changes) and you did not pin it explicitly, fail
          # — release that dependency first (wait for its run to finish, which creates the tag), or pass its
          # *_dependency input.
          changelog_latest() { grep -oE "^## \[[0-9]+\.[0-9]+\.[0-9]+" "$1/CHANGELOG.md" 2>/dev/null | sed -E 's/^## \[//' | sort -V | tail -n1; }
          version_gt() { [[ "$1" != "$2" ]] && [[ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -n1)" == "$1" ]]; }
          check_dep() {  # <name> <pinned> <override> <changelog-dir>
            [[ -n "$3" ]] && return 0
            local declared; declared="$(changelog_latest "$4")"
            if [[ -n "$declared" ]] && version_gt "$declared" "$2"; then
              echo "::error::Dependency '$1' documents [$declared] in its CHANGELOG but the floor to be pinned is $2 (its latest tag) — it has unreleased changes. Release '$1' first (wait for its run to finish), or pass ${1}_dependency=$declared."
              exit 1
            fi
          }
          case "$KEY" in
            core)         check_dep abstractions "$VER_ABS" "$DEP_ABS" "src/DotnetCronner.Abstractions" ;;
            redis|efcore) check_dep abstractions "$VER_ABS" "$DEP_ABS" "src/DotnetCronner.Abstractions"
                          check_dep core "$VER_CORE" "$DEP_CORE" "src/DotnetCronner" ;;
          esac

          # The package being released takes its computed VERSION.
          case "$KEY" in
            abstractions) VER_ABS="$VERSION" ;;
            core)         VER_CORE="$VERSION" ;;
            redis)        VER_REDIS="$VERSION" ;;
            efcore)       VER_EF="$VERSION" ;;
          esac

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "pkgdir=$PKGDIR" >> "$GITHUB_OUTPUT"
          echo "package_id=$PACKAGE_ID" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "ver_abstractions=$VER_ABS" >> "$GITHUB_OUTPUT"
          echo "ver_core=$VER_CORE" >> "$GITHUB_OUTPUT"
          echo "ver_redis=$VER_REDIS" >> "$GITHUB_OUTPUT"
          echo "ver_efcore=$VER_EF" >> "$GITHUB_OUTPUT"

          {
            echo "## Release plan"
            echo "- **Package:** \`$KEY\`"
            echo "- **Version:** \`$VERSION\` (prerelease: $PRERELEASE)"
            echo "- **Tag:** \`$TAG\`"
            echo "- **Dependency versions used:** abstractions \`$VER_ABS\`, core \`$VER_CORE\`, redis \`$VER_REDIS\`, efcore \`$VER_EF\`"
            echo ""
            echo "The NuGet push is gated on the \`release\` environment — approve it to publish."
          } >> "$GITHUB_STEP_SUMMARY"

      # Show EXACTLY what will ship as release notes — both the Markdown (GitHub Release) and the flattened
      # plain text (NuGet) — so you can eyeball them before approving the publish gate.
      - name: Release-notes preview
        env:
          PKGDIR: ${{ steps.plan.outputs.pkgdir }}
          VERSION: ${{ steps.plan.outputs.version }}
          KEY: ${{ github.event.inputs.package }}
        run: |
          set -euo pipefail
          bash .github/scripts/release-notes.sh "$PKGDIR/CHANGELOG.md" "$VERSION" notes.md notes.txt

          # A release MUST document its version. No section = hard fail here in prepare, so publish never runs.
          if [[ ! -s notes.md ]]; then
            {
              echo ""
              echo "## ❌ Release blocked — no changelog for \`$KEY $VERSION\`"
              echo ""
              echo "> There is no \`## [$VERSION]\` section in \`$PKGDIR/CHANGELOG.md\`."
              echo "> Roll your \`## [Unreleased]\` entries into \`## [$VERSION] - <date>\`, commit, and re-run."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::No '## [$VERSION]' section in $PKGDIR/CHANGELOG.md — every release must document its version."
            exit 1
          fi

          {
            echo ""
            echo "## Release notes for \`$KEY $VERSION\`"
            echo ""
            echo "### Markdown — goes to the GitHub Release"
            echo ""
            cat notes.md
            echo ""
            echo "### Plain text — goes to the NuGet release-notes field"
            echo ""
            echo '```text'
            cat notes.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: dotnet build DotnetCronner.slnx -c Release

      - name: Test (unit)
        run: dotnet test tests/DotnetCronner.Tests -c Release --no-build

      - name: Test (integration — PostgreSQL, SQL Server, Redis in Docker)
        # DotnetCronner.IntegrationTests starts PostgreSQL, SQL Server and Redis via Testcontainers to prove the
        # cross-process execution lock on the real backends. ubuntu-latest ships Docker; CRONNER_REQUIRE_DOCKER=1
        # makes those tests FAIL rather than skip if Docker were ever missing, so the evidence can never silently
        # disappear from a green build. Run AFTER the unit suite (not alongside it): both contain timing-sensitive
        # scheduler tests, and sharing the runner's two cores with container start-ups starves their timers.
        run: dotnet test tests/DotnetCronner.IntegrationTests -c Release --no-build
        env:
          CRONNER_REQUIRE_DOCKER: "1"

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    environment: release   # approval gate: configure required reviewers in Settings > Environments
    permissions:
      contents: write      # create the tag + GitHub Release
      id-token: write      # mint the OIDC token that NuGet trusted publishing exchanges for a temp key
    env:
      KEY: ${{ github.event.inputs.package }}
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
      PROJECT: ${{ needs.prepare.outputs.project }}
      PKGDIR: ${{ needs.prepare.outputs.pkgdir }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # Produce notes.md (Markdown → GitHub Release) and notes.txt (plain text → NuGet) for this version.
      - name: Release notes
        run: bash .github/scripts/release-notes.sh "$PKGDIR/CHANGELOG.md" "$VERSION" notes.md notes.txt

      - name: Pack
        env:
          CRONNER_VER_ABSTRACTIONS: ${{ needs.prepare.outputs.ver_abstractions }}
          CRONNER_VER_CORE: ${{ needs.prepare.outputs.ver_core }}
          CRONNER_VER_REDIS: ${{ needs.prepare.outputs.ver_redis }}
          CRONNER_VER_EFCORE: ${{ needs.prepare.outputs.ver_efcore }}
        run: |
          set -euo pipefail
          # Plain-text notes for this version only → Directory.Build.props reads CRONNER_RELEASE_NOTES.
          export CRONNER_RELEASE_NOTES="$(cat notes.txt)"
          dotnet pack "$PROJECT" -c Release -o out

      # Trusted Publishing (OIDC) — no stored API key. This step exchanges the job's short-lived GitHub
      # OIDC token for a temporary NuGet API key, valid for a few minutes and scoped to this repo/workflow
      # by the policy you create at nuget.org > Account > Trusted Publishing. Requires `id-token: write`
      # (above) and the repo variable NUGET_USER set to your nuget.org username.
      - name: NuGet login (trusted publishing)
        id: nuget
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to NuGet
        env:
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          dotnet nuget push "out/*.nupkg" --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json --skip-duplicate
          if compgen -G "out/*.snupkg" > /dev/null; then
            dotnet nuget push "out/*.snupkg" --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json --skip-duplicate || true
          fi

      # ── Break-glass fallback: stored API key ─────────────────────────────────────────────────────
      # If trusted publishing is ever unavailable, add the NUGET_KEY secret and replace the two steps
      # above with the one below (you can also drop `id-token: write` from this job's permissions):
      #
      #   - name: Push to NuGet (API key fallback)
      #     env:
      #       NUGET_KEY: ${{ secrets.NUGET_KEY }}
      #     run: |
      #       set -euo pipefail
      #       dotnet nuget push "out/*.nupkg" --api-key "$NUGET_KEY" \
      #         --source https://api.nuget.org/v3/index.json --skip-duplicate
      #       if compgen -G "out/*.snupkg" > /dev/null; then
      #         dotnet nuget push "out/*.snupkg" --api-key "$NUGET_KEY" \
      #           --source https://api.nuget.org/v3/index.json --skip-duplicate || true
      #       fi

      - name: Tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ARGS=()
          [[ "$PRERELEASE" == "true" ]] && ARGS+=(--prerelease)
          # Markdown changelog section for this version → the Release body. Fall back to auto-generated
          # notes only if the changelog has no section for it.
          if [[ -s notes.md ]]; then ARGS+=(--notes-file notes.md); else ARGS+=(--generate-notes); fi
          gh release create "$TAG" out/*.nupkg \
            --target "$GITHUB_SHA" \
            --title "$KEY v$VERSION" \
            "${ARGS[@]}"

